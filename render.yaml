# Render blueprint: the API only.
#
# The database is deliberately NOT provisioned here. Render's free Postgres
# expires 30 days after creation and is deleted after a further 14-day grace
# period, which is useless for a demo that needs to stay reachable. Use Neon
# instead (free tier is permanent, no card, scales to zero when idle) and paste
# its connection string into DATABASE_URL below.
#
# Deploy: Render dashboard > New > Blueprint > connect this repo.
#
# After the frontend is on Vercel, set ALLOWED_ORIGINS to its URL. Until then
# "*" is fine -- there is no auth and no cookies, so a wildcard origin exposes
# nothing that the API would not serve to a direct request anyway.

services:
  - type: web
    name: learnio-api
    runtime: docker
    # Free instance type. Render's dashboard defaults to a PAID tier when you
    # create a service by hand, so pin it here and deploy via the blueprint.
    plan: free
    rootDir: backend
    dockerfilePath: ./Dockerfile
    healthCheckPath: /api/health
    envVars:
      # Neon connection string. Any scheme works -- config.py rewrites
      # postgres:// and postgresql:// to the psycopg driver.
      - key: DATABASE_URL
        sync: false
      # The deployed frontend origin, e.g. https://learnio.vercel.app
      # Comma-separate to allow several.
      - key: ALLOWED_ORIGINS
        sync: false
      # Optional. Enables LLM topic tagging on upload; without it the app
      # falls back to keyword matching and still works end to end.
      - key: GEMINI_API_KEY
        sync: false
