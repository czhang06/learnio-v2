# Render blueprint: one web service + one Postgres instance.
#
# Deploy by pointing Render at this repo (New > Blueprint). Check the current
# free-tier terms yourself before relying on them -- they change, and a free
# Postgres instance on some plans expires after a fixed period.
#
# After the first deploy, set ALLOWED_ORIGINS to the Vercel URL of the
# frontend, otherwise the browser will block every request with a CORS error.

services:
  - type: web
    name: learnio-api
    runtime: docker
    rootDir: backend
    dockerfilePath: ./Dockerfile
    healthCheckPath: /api/health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: learnio-db
          property: connectionString
      # Set to the deployed frontend origin, e.g. https://learnio.vercel.app
      - key: ALLOWED_ORIGINS
        sync: false
      # Optional: enables LLM topic tagging on upload. Without it the app
      # falls back to keyword matching and still works.
      - key: GEMINI_API_KEY
        sync: false

databases:
  - name: learnio-db
    databaseName: learnio
    user: learnio
