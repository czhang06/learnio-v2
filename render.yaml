# Render blueprint: the API only.
#
# The database is deliberately NOT provisioned here. Render's free Postgres
# expires 30 days after creation and is deleted after a further 14-day grace
# period, which is useless for a demo that needs to stay reachable. Use Neon
# instead (free tier is permanent, no card, scales to zero when idle) and paste
# its connection string into DATABASE_URL below.
#
# Deploy: Render dashboard > New > Blueprint > connect this repo.
#
# After the frontend is on Vercel, set ALLOWED_ORIGINS to its URL. Until then
# "*" is fine -- there is no auth and no cookies, so a wildcard origin exposes
# nothing that the API would not serve to a direct request anyway.

services:
  - type: web
    name: learnio-api
    runtime: docker
    # Free instance type. Render's dashboard defaults to a PAID tier when you
    # create a service by hand, so pin it here and deploy via the blueprint.
    plan: free
    rootDir: backend
    dockerfilePath: ./Dockerfile
    healthCheckPath: /api/health
    envVars:
      # Neon connection string. Any scheme works -- config.py rewrites
      # postgres:// and postgresql:// to the psycopg driver.
      - key: DATABASE_URL
        sync: false
      # The deployed frontend origin, e.g. https://learnio.vercel.app
      # Comma-separate to allow several.
      - key: ALLOWED_ORIGINS
        sync: false
      # Optional. Enables LLM topic tagging on upload; without it the app
      # falls back to keyword matching and still works end to end.
      - key: GEMINI_API_KEY
        sync: false
      # Makes the public demo read-only: adding courses and uploading PDFs
      # need this value as the X-Admin-Key header (the site asks for it once
      # under Upload). Use a long random string. Leave unset to allow writes.
      - key: ADMIN_KEY
        sync: false
      # Uploaded PDFs are kept so ingestion can be re-run. The instance disk
      # is wiped on every deploy, so production stores them in Backblaze B2
      # (free: first 10 GB, no card) through its S3-compatible API.
      # Create a private bucket and an application key limited to it, then set:
      - key: STORAGE_BACKEND
        value: s3
      - key: S3_BUCKET
        sync: false
      # Shown on the bucket page, e.g. https://s3.us-west-004.backblazeb2.com
      - key: S3_ENDPOINT_URL
        sync: false
      # The region in that endpoint, e.g. us-west-004
      - key: S3_REGION
        sync: false
      # The application key's keyID and applicationKey
      - key: S3_ACCESS_KEY_ID
        sync: false
      - key: S3_SECRET_ACCESS_KEY
        sync: false
